name: Key check
"on": {workflow_dispatch: {}}
jobs: {check: {runs-on: ubuntu-latest, timeout-minutes: 5, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: "22"}}, {name: Check Gemini keys, env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", GEMINI_API_KEY_2: "${{ secrets.GEMINI_API_KEY_2 }}", GEMINI_API_KEY_3: "${{ secrets.GEMINI_API_KEY_3 }}", GEMINI_API_KEY_4: "${{ secrets.GEMINI_API_KEY_4 }}", GEMINI_API_KEY_5: "${{ secrets.GEMINI_API_KEY_5 }}", OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"}, run: node keycheck.js}]}}
