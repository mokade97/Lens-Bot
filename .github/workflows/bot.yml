name: Lens Bot
"on": {schedule: [{cron: "7,22,37,52 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: lens-bot, cancel-in-progress: false}
jobs: {run: {runs-on: ubuntu-latest, timeout-minutes: 12, steps: [{uses: actions/checkout@v4, with: {ref: main}}, {uses: actions/setup-node@v4, with: {node-version: "22"}}, {name: Run bot, env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", GEMINI_API_KEY_2: "${{ secrets.GEMINI_API_KEY_2 }}", GEMINI_API_KEY_3: "${{ secrets.GEMINI_API_KEY_3 }}"}, run: node bot.js}, {name: Commit state, run: "git config user.name lens-bot && git config user.email lens-bot@users.noreply.github.com && git add state.json public/bot.json && (git diff --cached --quiet && echo no-change || git commit -m bot-update) && (git push origin HEAD:main || (git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main))"}]}}
