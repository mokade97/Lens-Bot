name: Lens Bot
"on": {schedule: [{cron: "7,22,37,52 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: lens-bot, cancel-in-progress: false}
jobs: {run: {runs-on: ubuntu-latest, timeout-minutes: 20, steps: [{uses: actions/checkout@v4, with: {ref: main}}, {uses: actions/setup-node@v4, with: {node-version: "22"}}, {name: Run bot, env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", GEMINI_API_KEY_2: "${{ secrets.GEMINI_API_KEY_2 }}", GEMINI_API_KEY_3: "${{ secrets.GEMINI_API_KEY_3 }}", GEMINI_API_KEY_4: "${{ secrets.GEMINI_API_KEY_4 }}", GEMINI_API_KEY_5: "${{ secrets.GEMINI_API_KEY_5 }}", OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}", OKX_API_KEY: "${{ secrets.OKX_API_KEY }}", OKX_API_SECRET: "${{ secrets.OKX_API_SECRET }}", OKX_API_PASSPHRASE: "${{ secrets.OKX_API_PASSPHRASE }}"}, run: node bot.js}, {name: Fetch mm-lab report, run: "mkdir -p public && (curl -fsS --max-time 15 http://192.3.36.26:8787/mm.json -o public/mm.json.tmp && mv public/mm.json.tmp public/mm.json) || echo mm-lab unreachable"}, {name: Commit state, run: "git config user.name lens-bot && git config user.email lens-bot@users.noreply.github.com && git add state.json public/bot.json public/mm.json && (git diff --cached --quiet && echo no-change || git commit -m bot-update) && (git push origin HEAD:main || (git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main))"}]}}
